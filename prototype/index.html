<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toy Room</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; color: #fff; text-shadow: 0 1px 3px #000a; }
    #crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 2px #000; }
    #status { position: absolute; left: 16px; top: 12px; font-size: 14px; }
    #help { position: absolute; left: 16px; bottom: 12px; font-size: 12px; line-height: 1.6; opacity: .85; }
    #hunt { position: absolute; right: 16px; top: 12px; font-size: 14px; background: #0006; padding: 10px 14px; border-radius: 8px; min-width: 170px; }
    #hunt li.found { text-decoration: line-through; opacity: .6; }
    #hunt ul { margin: 6px 0 0; padding-left: 18px; }
    #toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-size: 22px; font-weight: bold; opacity: 0; transition: opacity .3s; }
    #bar { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; }
    #bar button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; border: 1px solid #fff6; background: #0007; color: #fff; cursor: pointer; }
    #bar button.on { background: #f2b33d; color: #222; border-color: #f2b33d; }
    #bar .sep { width: 10px; }
    #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0008; font-size: 20px; pointer-events: auto; cursor: pointer; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="status"></div>
    <div id="hunt"></div>
    <div id="toast"></div>
    <div id="bar">
      <button data-mode="walk">歩く（人形）</button>
      <button data-mode="fly">飛ぶ</button>
      <span class="sep"></span>
      <button data-page="1">見開き1</button>
      <button data-page="2">見開き2</button>
      <button data-page="3">見開き3</button>
    </div>
    <div id="help">
      ドラッグ: 見まわす　クリック: さがしものを選ぶ　WASD／矢印: 移動　Ctrl: はやく　Space: ジャンプ・上昇　Shift: 下降<br>
      Tab: 歩く ⇔ 飛ぶ　1〜3: 絵本の見開き
    </div>
    <div id="start">クリックしてはじめる</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
